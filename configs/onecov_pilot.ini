; Small Fourier-space experiment, NOT a converged production covariance.
; The runner installs survey values and input/output paths from the LSST
; export. Change one numerical control at a time in a copy of this file.

[covariance terms]
gauss = True
split_gauss = True
nongauss = False
ssc = False

[observables]
cosmic_shear = True
est_shear = C_ell
ggl = False
est_ggl = C_ell
clustering = False
est_clust = C_ell
cstellar_mf = False
cross_terms = True
unbiased_clustering = False

[covELLspace settings]
; Internal interpolation grid; output has only five multipole bands.
ell_min = 10
ell_max = 5000
ell_bins = 257
ell_type = log
ell_min_lensing = 30
ell_max_lensing = 3000
ell_bins_lensing = 5
ell_type_lensing = log
ell_min_clustering = 30
ell_max_clustering = 3000
ell_bins_clustering = 5
ell_type_clustering = log
limber = True
delta_z = 0.1
tri_delta_z = 0.5
integration_steps = 300
nz_interpolation_polynom_order = 1
mult_shear_bias = 0

[covTHETAspace settings]
; No real-space covariance is requested. This is an inherited integrator
; setting also read by the angular-spectrum constructor.
integration_intervals = 40

[IA]
A_IA = 0
eta_IA = 0
z_pivot_IA = 0.3

[bias]
model = Tinker10
bias_2h = 1
mc_relation_cen = duffy08
mc_relation_sat = duffy08
norm_mc_relation_cen = 1
norm_mc_relation_sat = 1
log10mass_bins = 9.1, 11.3

[hod]
; OneCov initializes an HOD object even for shear-only or supplied-bias
; runs. These ancillary values are from its pure-Cell example; they are
; not an LSST HOD fit. Galaxy spectra use the supplied bias table instead.
model_mor_cen = double_powerlaw
model_mor_sat = double_powerlaw
dpow_logm0_cen = 10.51
dpow_logm1_cen = 11.38
dpow_a_cen = 7.096
dpow_b_cen = 0.2
dpow_norm_cen = 1
dpow_norm_sat = 0.56
model_scatter_cen = lognormal
model_scatter_sat = modschechter
logn_sigma_c_cen = 0.35
modsch_logmref_sat = 13
modsch_alpha_s_sat = -0.858
modsch_b_sat = -0.024, 1.149

[halomodel evaluation]
; These native halo choices are explicit but are not yet matched to
; Cocoa. In particular, agreement of Gaussian output says nothing about
; whether these mass/concentration choices match the connected term.
M_bins = 200
log10M_min = 6
log10M_max = 17
hmf_model = Tinker10
mdef_model = SOMean
mdef_params = overdensity, 200
disable_mass_conversion = True
delta_c = 1.686
transfer_model = CAMB
small_k_damping_for1h = damped

[powspec evaluation]
non_linear_model = takahashi
log10k_bins = 200
log10k_min = -5
log10k_max = 2

[trispec evaluation]
; Eight k values mean 36 independent pairs. This intentionally small
; table measures feasibility; it cannot establish cNG accuracy.
log10k_bins = 8
log10k_min = -4
log10k_max = 2
matter_klim = 0.001
matter_mulim = 0.001
small_k_damping_for1h = damped
lower_calc_limit = 1e-200

[output settings]
file = covariance_list.dat, covariance_matrix.mat
style = list, matrix
list_style_spatial_first = True
corrmatrix_plot = False
save_configs = resolved.ini
save_Cells = True
save_trispectra = False
save_alms = False
use_tex = False
